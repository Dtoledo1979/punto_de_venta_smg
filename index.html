<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today</title>
<script>window.POS_ENV = { supabaseUrl: "%VITE_SUPABASE_URL%", supabaseAnonKey: "%VITE_SUPABASE_ANON_KEY%", officePage: "today" }; document.documentElement.classList.add("pos-auth-pending");</script>
<style>html.pos-auth-pending body{visibility:hidden}</style>
<link rel="stylesheet" href="/css/ui.css">
<style>
  .today-grid{display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(0, 1fr); gap:16px; align-items:start;}
  @media (max-width: 1000px){ .today-grid{grid-template-columns:1fr;} }
  .start-card{display:grid; gap:12px; justify-items:start;}
</style>
</head>
<body>
<main class="main-inner" id="today">
  <div class="page-head">
    <div><h1 data-i18n>Today</h1><p id="today-date"></p></div>
    <select class="select" id="loc-filter" style="width:auto; min-width:200px;" hidden aria-label="Location"></select>
  </div>

  <div id="staff-start" class="panel start-card" hidden>
    <h2 data-i18n>Ready to sell?</h2>
    <p class="muted" data-i18n>Open the register for your location and start taking orders.</p>
    <button class="btn btn-primary btn-lg" type="button" onclick="posOffice.openRegisterDialog()" data-i18n>Open a register</button>
  </div>

  <div id="owner-view" class="stack" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="today-grid">
      <div class="stack">
        <section class="panel" id="by-location-panel" hidden>
          <div class="panel-head"><h2 data-i18n>By location</h2></div>
          <div class="bars" id="by-location"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2 data-i18n>Best sellers today</h2></div>
          <div class="bars" id="top-products"></div>
        </section>
        <section class="panel" id="events-panel" hidden>
          <div class="panel-head"><h2 data-i18n>Active events</h2></div>
          <div class="list" id="events-list"></div>
        </section>
      </div>
      <div class="stack">
        <section class="panel" id="setup-panel" hidden>
          <div class="panel-head"><h2 data-i18n>Getting started</h2><span class="muted num" id="setup-count"></span></div>
          <div class="checklist" id="setup-list"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2 data-i18n>Needs attention</h2></div>
          <div class="stack-sm" id="attention"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2 data-i18n>Registers open now</h2></div>
          <div class="list" id="open-sessions"></div>
        </section>
      </div>
    </div>
    <p class="faint" id="as-of" style="font-size:12.5px;"></p>
  </div>
</main>

<script src="/vendor/supabase.js"></script>
<script src="/js/pos-utils.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-es.js"></script>
<script src="/js/pos-core.js"></script>
<script src="/js/office.js"></script>
<script>
  const sb = posCore.sb;
  const E = posUtils.escapeHtml;
  const $ = (id) => document.getElementById(id);
  let locationId = null;
  let refreshTimer = null;

  function delta(now, before) {
    if (!before) return '<span class="k-delta">' + E(t("No sales this time last week")) + "</span>";
    const pct = Math.round(((now - before) / before) * 100);
    const cls = pct > 0 ? "up" : pct < 0 ? "down" : "";
    return '<span class="k-delta ' + cls + '">' + E(t("{pct}% vs. last {weekday}", { pct: (pct > 0 ? "+" : "") + pct, weekday: weekdayName(-7) })) + "</span>";
  }
  function dayFormatter(opts) {
    const loc = posI18n.lang === "es" ? "es-NZ" : ((posCore.org && posCore.org.locale) || "en-NZ");
    return new Intl.DateTimeFormat(loc, { ...opts, timeZone: posCore.org.timezone || "Pacific/Auckland" });
  }
  function weekdayName(offsetDays) { return dayFormatter({ weekday: "long" }).format(new Date(Date.now() + offsetDays * 86400000)); }

  function bars(rows, valueFn, labelFn, fmt) {
    const max = Math.max(0, ...rows.map(valueFn));
    return rows.map((r) => {
      const v = valueFn(r);
      const w = max > 0 ? Math.max(2, Math.round((v / max) * 100)) : 0;
      return '<div class="bar"><span class="b-label" title="' + E(labelFn(r)) + '">' + E(labelFn(r)) + '</span>' +
        '<span class="b-track"><span class="b-fill" style="width:' + w + '%"></span></span><span class="b-value">' + E(fmt(v)) + "</span></div>";
    }).join("");
  }

  async function load() {
    const { data: o, error } = await sb.rpc("today_overview", { p_org_id: posCore.orgId, p_location_id: locationId });
    if (error) { $("kpis").innerHTML = '<div class="msg error">' + E(posCore.errorText(error)) + "</div>"; return; }
    const money = (v) => posCore.money(Number(v));

    $("kpis").innerHTML = [
      { l: t("Sales"), v: money(o.sales), d: delta(Number(o.sales), Number(o.last_week.sales)) },
      { l: t("Orders"), v: String(o.orders), d: delta(o.orders, o.last_week.orders) },
      { l: t("Average sale"), v: money(o.avg_ticket), d: delta(Number(o.avg_ticket), Number(o.last_week.avg_ticket)) },
      { l: t("Registers open"), v: t("{open} of {total}", { open: o.registers.open, total: o.registers.total }), d: '<span class="k-delta">' + E(t("Refunds today: {amount}", { amount: money(o.refunds) })) + "</span>" },
    ].map((k) => '<div class="kpi"><span class="k-label">' + E(k.l) + '</span><span class="k-value">' + E(k.v) + "</span>" + k.d + "</div>").join("");

    const showLocs = !locationId && o.by_location.length > 1;
    $("by-location-panel").hidden = !showLocs;
    if (showLocs) $("by-location").innerHTML = bars(o.by_location, (r) => Number(r.sales), (r) => r.name, money);

    $("top-products").innerHTML = o.top_products.length
      ? bars(o.top_products, (r) => Number(r.qty), (r) => r.name, (v) => String(Number(v)))
      : '<div class="empty"><b>' + E(t("No sales yet today")) + "</b><span>" + E(t("Sales show up here as soon as a register charges an order.")) + "</span></div>";

    // Lo que necesita atención: stock bajo y diferencias del último cierre.
    const att = [];
    for (const s of o.low_stock) {
      const qty = Number(s.qty).toLocaleString(posCore.org.locale || "en-NZ", { maximumFractionDigits: 2 });
      att.push('<div class="notice ' + (s.pct <= 0.1 ? "bad" : "warn") + '"><span class="dot"></span><span><b>' + E(s.name) + "</b> · " +
        E(t("{qty} {unit} left ({pct}% of the last restock)", { qty, unit: s.unit || t("units"), pct: Math.round(s.pct * 100) })) +
        ' <span class="muted">· ' + E(s.register) + "</span></span></div>");
    }
    if (o.last_close_variance) {
      const v = o.last_close_variance;
      att.push('<div class="notice warn"><span class="dot"></span><span>' + E(t("{register} closed with a cash difference of {amount}.", { register: v.register, amount: money(v.variance) })) + "</span></div>");
    }
    $("attention").innerHTML = att.length ? att.join("") : '<div class="notice ok"><span class="dot"></span><span>' + E(t("All good. Nothing needs your attention.")) + "</span></div>";

    $("open-sessions").innerHTML = o.open_sessions.length
      ? o.open_sessions.map((s) => '<div class="list-item"><span class="pill ok"><span class="dot"></span>' + E(t("Open")) + '</span><div class="grow"><b>' + E(s.register) + '</b> <span class="muted">· ' + E(s.location) + '</span></div><span class="muted num">' +
          E(t("since {time}", { time: posCore.fmtTime(s.opened_at) })) + (s.opened_by ? " · " + E(s.opened_by) : "") + "</span></div>").join("")
      : '<div class="empty"><span>' + E(t("No register is open right now.")) + '</span><button class="btn" type="button" onclick="posOffice.openRegisterDialog()">' + E(t("Open a register")) + "</button></div>";

    // Primeros pasos: se oculta cuando todo está listo.
    const steps = [
      { done: o.setup.details, label: t("Add your business details"), href: "/ajustes.html" },
      { done: o.setup.registers, label: t("Create a location and register"), href: "/locales.html" },
      { done: o.setup.products, label: t("Add your products"), href: "/insumos.html#productos" },
      { done: o.setup.first_sale, label: t("Make a test sale"), action: true },
      { done: o.setup.team, label: t("Invite your team"), href: "/equipo.html" },
    ];
    const doneCount = steps.filter((s) => s.done).length;
    $("setup-panel").hidden = doneCount === steps.length || !posCore.isAdmin();
    $("setup-count").textContent = t("{done} of {total}", { done: doneCount, total: steps.length });
    $("setup-list").innerHTML = steps.map((s) => s.done
      ? '<span class="check done"><span class="box"></span>' + E(s.label) + "</span>"
      : s.action ? '<a class="check" href="#" data-open-register><span class="box"></span>' + E(s.label) + "</a>"
      : '<a class="check" href="' + s.href + '"><span class="box"></span>' + E(s.label) + "</a>").join("");
    const openLink = $("setup-list").querySelector("[data-open-register]");
    if (openLink) openLink.onclick = (e) => { e.preventDefault(); posOffice.openRegisterDialog(); };

    $("as-of").textContent = t("Updated {time}. Test-mode sales are not included.", { time: posCore.fmtTime(o.as_of) });
  }

  // Negocios de eventos (South Media): acceso directo al reporte de cada evento.
  async function loadEvents() {
    const { data } = await sb.from("events").select("id, name, event_date").eq("org_id", posCore.orgId).eq("active", true).order("created_at");
    $("events-panel").hidden = !(data && data.length);
    if (!data || !data.length) return;
    $("events-list").innerHTML = data.map((e) => '<div class="list-item"><div class="grow"><b>' + E(e.name) + "</b>" +
      (e.event_date ? ' <span class="muted">· ' + E(posCore.fmtDate(e.event_date + "T12:00:00")) + "</span>" : "") + "</div>" +
      '<button class="btn btn-sm" type="button" data-id="' + E(e.id) + '" data-name="' + E(e.name) + '">' + E(t("View report")) + "</button></div>").join("");
    $("events-list").querySelectorAll("button").forEach((b) => b.onclick = () => {
      sessionStorage.setItem("pos_selected_event_id", b.dataset.id);
      sessionStorage.setItem("pos_selected_event_name", b.dataset.name);
      location.href = "/dashboard.html";
    });
  }

  async function loadLocations() {
    const { data } = await sb.from("locations").select("id, name").eq("org_id", posCore.orgId).order("created_at");
    if (!data || data.length < 2) return;
    const sel = $("loc-filter");
    sel.innerHTML = '<option value="">' + E(t("All locations")) + "</option>" + data.map((l) => '<option value="' + E(l.id) + '">' + E(l.name) + "</option>").join("");
    sel.hidden = false;
    sel.onchange = () => { locationId = sel.value || null; load(); };
  }

  posCore.ready.then(() => {
    $("today-date").textContent = dayFormatter({ weekday: "long", day: "numeric", month: "long" }).format(new Date());
    if (!["owner", "admin", "manager"].includes(posCore.role)) { $("staff-start").hidden = false; return; }
    $("owner-view").hidden = false;
    loadLocations();
    loadEvents();
    load();
    refreshTimer = setInterval(() => { if (!document.hidden) load(); }, 60000);
  });
</script>
</body>
</html>
