<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto de Venta — South Media Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --surface:#FFFFFF; --surface-dark:#151B23; --surface-dark-2:#171C24; --surface-alt:#F4F6F8;
    --text-primary:#12161C; --text-muted:#62707D;
    --primary:#A8E020; --primary-hover:#96CB1D; --primary-active:#87B518; --primary-ink:#1A2333;
    --danger:#E4483A; --danger-bg:#FBE6E4; --warning:#D98B00; --warning-bg:#FBEBD3; --success:#2FA35A; --success-bg:#E3F5EA;
    --border:#E2E6EA; --border-dark:#232B36;
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-card:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text-primary); font-family:'Inter',Arial,sans-serif; min-height:100vh;}
  .top{display:flex; align-items:center; gap:10px; padding:22px 24px 0;}
  .mark{width:30px; height:30px; flex:none;}
  .mark path{fill:var(--primary);}
  .word{color:#fff; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; letter-spacing:.3px;}
  .word span{color:var(--primary);}
  .hero{padding:36px 24px 8px; max-width:920px; margin:0 auto;}
  .hero h1{color:#fff; font-family:'Sora',sans-serif; font-weight:800; font-size:clamp(26px,5vw,38px); line-height:1.15; margin:0 0 8px;}
  .hero p{color:#9AA7B2; font-size:14.5px; margin:0; max-width:56ch; line-height:1.5;}
  main{max-width:920px; margin:0 auto; padding:20px 24px 60px;}

  .step-title{color:#fff; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; margin:26px 0 10px; display:flex; align-items:center; gap:8px;}
  .step-title .num{background:var(--primary); color:var(--primary-ink); width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px;}

  .event-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:10px;}
  .event-card{background:var(--surface-dark); border:2px solid var(--border-dark); border-radius:var(--r-card); padding:16px; cursor:pointer; text-align:left; color:#fff; font-family:inherit; min-height:44px; transition:border-color .15s;}
  .event-card:hover{border-color:#3A4552;}
  .event-card.selected{border-color:var(--primary); background:#1A2314;}
  .event-card .ename{font-weight:700; font-size:15px;}
  .event-card .edate{font-size:12.5px; color:#9AA7B2; margin-top:3px;}
  .event-card .live{display:none; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--primary); margin-top:8px;}
  .event-card.selected .live{display:flex;}
  .event-card .live .dot{width:6px; height:6px; border-radius:50%; background:var(--primary);}
  .event-card .check{float:right; color:var(--primary); font-weight:800; display:none;}
  .event-card.selected .check{display:inline;}
  .no-events{color:#9AA7B2; font-size:13.5px; background:var(--surface-dark); border:1px solid var(--border-dark); border-radius:var(--r-card); padding:16px;}

  .enter-row{margin-top:18px;}
  .btn{font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px; border:none; border-radius:var(--r-md); padding:12px 20px; min-height:46px; cursor:pointer; transition:background .15s, transform .1s, opacity .15s; display:inline-flex; align-items:center; justify-content:center; gap:8px;}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--primary); color:var(--primary-ink);}
  .btn-primary:hover:not(:disabled){background:var(--primary-hover);}
  .btn-primary:active:not(:disabled){background:var(--primary-active);}

  .quick-row{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}
  .quick-link{flex:1; min-width:220px; background:var(--surface-dark); border:1px solid var(--border-dark); color:#C9D3DC; border-radius:var(--r-card); padding:16px 18px; text-decoration:none; display:flex; align-items:center; justify-content:space-between; font-size:13.5px; min-height:44px;}
  .quick-link b{color:#fff; font-weight:600;}
  .quick-link .go{color:var(--primary); font-size:17px;}
  .quick-title{color:#5C6A77; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; margin-top:24px;}
</style>
</head>
<body>

<div class="top">
  <svg class="mark" viewBox="0 0 24 24"><path d="M12 1l2.9 7.1L22 11l-7.1 2.9L12 21l-2.9-7.1L2 11l7.1-2.9L12 1z"/></svg>
  <div class="word">SOUTH MEDIA <span>GROUP</span></div>
</div>

<div class="hero">
  <h1>Operación de eventos</h1>
  <p>Elige el evento en el que vas a trabajar. Adentro vas a encontrar ventas, entrega, inventario y reportes de ese evento.</p>
</div>

<main>
  <div class="step-title"><span class="num">1</span> Elige el evento</div>
  <div id="event-area"></div>

  <div class="enter-row">
    <button class="btn btn-primary" id="enter-btn" disabled onclick="enterEvent()">Entrar al evento →</button>
  </div>

  <div class="quick-title">Acceso directo (sin pasar por el dashboard)</div>
  <div class="quick-row">
    <a class="quick-link" href="despacho.html"><span>Pantalla de <b>Entrega</b></span><span class="go">→</span></a>
    <a class="quick-link" href="insumos.html"><span><b>Insumos, stock y recetas</b></span><span class="go">→</span></a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://umbkpzhgocryhcbbczhr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtYmtwemhnb2NyeWhjYmJjemhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Mzc2MzIsImV4cCI6MjA5ODAxMzYzMn0.h4LlS7gUh229gnmkxw12g58SRRs0jTas-ox-em1lfbg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: "pos" } });

  let openEvents = [];
  let selectedId = sessionStorage.getItem("pos_selected_event_id");

  async function loadEvents() {
    const area = document.getElementById("event-area");
    try {
      const { data, error } = await sb.from("events").select("*").eq("active", true).order("created_at");
      if (error) throw error;
      openEvents = data || [];

      if (openEvents.length === 0) {
        area.innerHTML = '<div class="no-events">Sin eventos activos todavía — entra a "Insumos, stock y recetas" o abre una caja de Productos/Tickets y usa "Iniciar nuevo evento" para crear el primero.</div>';
        selectedId = null;
        updateEnterBtn();
        return;
      }

      if (selectedId && !openEvents.some(e => e.id === selectedId)) selectedId = null;
      if (!selectedId && openEvents.length === 1) selectedId = openEvents[0].id;

      renderEvents();
      updateEnterBtn();
    } catch (e) {
      area.innerHTML = '<div class="no-events">No se pudo conectar a Supabase. Revisa la configuración.</div>';
    }
  }

  function renderEvents(){
    const area = document.getElementById("event-area");
    area.innerHTML = '<div class="event-grid">' + openEvents.map(e =>
      '<button class="event-card ' + (e.id === selectedId ? "selected" : "") + '" onclick="selectEvent(\'' + e.id + '\')">' +
        '<span class="check">✓</span>' +
        '<div class="ename">' + e.name + '</div>' +
        (e.event_date ? '<div class="edate">' + e.event_date + '</div>' : '') +
        '<div class="live"><span class="dot"></span> EN CURSO</div>' +
      '</button>'
    ).join("") + '</div>';
  }

  function selectEvent(id){
    selectedId = id;
    const ev = openEvents.find(e => e.id === id);
    sessionStorage.setItem("pos_selected_event_id", id);
    sessionStorage.setItem("pos_selected_event_name", ev ? ev.name : "");
    renderEvents();
    updateEnterBtn();
  }

  function updateEnterBtn(){
    document.getElementById("enter-btn").disabled = !selectedId;
  }

  function enterEvent(){
    if (!selectedId) return;
    location.href = "dashboard.html";
  }

  loadEvents();
</script>
</body>
</html>
