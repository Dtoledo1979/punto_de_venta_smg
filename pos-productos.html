<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Register</title>
<script>window.POS_ENV = { supabaseUrl: "%VITE_SUPABASE_URL%", supabaseAnonKey: "%VITE_SUPABASE_ANON_KEY%", registerType: "product", officePage: "register" }; document.documentElement.classList.add("pos-auth-pending");</script>
<style>html.pos-auth-pending body{visibility:hidden}</style>
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/register.css">
</head>
<body>
<div class="reg" id="reg-root">
  <header class="reg-top">
    <div class="who"><span class="mark" id="reg-mark">·</span><div style="min-width:0; display:grid;"><b id="reg-name" data-i18n>Register</b><span id="reg-place"></span></div></div>
    <button class="top-btn test-on" type="button" id="test-btn" hidden data-i18n>Test mode</button>
    <button class="top-btn" type="button" id="event-btn" hidden></button>
    <button class="top-btn" type="button" id="orders-btn"><span data-i18n>Orders</span> <span class="badge" id="orders-badge" hidden>0</span></button>
    <button class="top-btn" type="button" id="menu-btn" aria-label="Menu">⋯</button>
  </header>
  <div>
    <div class="test-banner" id="test-banner" hidden data-i18n>TEST MODE — these sales are not real and don't affect stock or reports</div>
    <div id="office-banner"></div>
    <div id="session-slot"></div>
  </div>
  <div class="reg-body">
    <nav class="cats" id="cats" aria-label="Categories"></nav>
    <div class="grid-wrap">
      <input class="input search" id="search" type="search" placeholder="Search product" data-i18n-ph autocomplete="off">
      <div class="tiles" id="tiles"></div>
    </div>
    <aside class="order" aria-label="Order">
      <div class="order-head">
        <div class="row-between"><h2 data-i18n>Order</h2><span class="row"><button class="link" type="button" id="clear" hidden data-i18n>Clear</button><button class="x-btn" type="button" id="order-close" aria-label="Close" style="display:none;">×</button></span></div>
        <div class="seg" id="order-type" role="group" aria-label="Order type">
          <button type="button" data-t="here" data-i18n>Eat in</button>
          <button type="button" data-t="takeaway" data-i18n>Takeaway</button>
        </div>
        <input class="input" id="customer" maxlength="60" autocomplete="off" placeholder="Name for the order (optional)">
      </div>
      <div class="lines" id="lines"></div>
      <div class="order-foot">
        <div class="tot"><span id="tax-line"></span></div>
        <div class="tot big"><span data-i18n>Total</span><span id="total">$0.00</span></div>
        <button class="btn btn-primary btn-block charge" type="button" id="charge" disabled data-i18n>Charge</button>
      </div>
    </aside>
  </div>
  <button class="btn btn-primary order-bar" type="button" id="order-bar" hidden></button>
</div>

<div class="lock" id="lock" hidden><div class="lock-card" id="lock-card"></div></div>
<dialog class="dialog" id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<div id="receipt-area"></div>

<script src="/vendor/supabase.js"></script>
<script src="/js/pos-utils.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-es.js"></script>
<script src="/js/pos-core.js"></script>
<script src="/js/pos-refunds.js"></script>
<script src="/js/pos-sessions.js"></script>
<script src="/js/register-app.js"></script>
<script>
  // En el teléfono, el pedido es una hoja: se muestra la X para cerrarla.
  const mq = window.matchMedia("(max-width: 860px)");
  const syncClose = () => { document.getElementById("order-close").style.display = mq.matches ? "" : "none"; };
  mq.addEventListener("change", syncClose); syncClose();
</script>
</body>
</html>
