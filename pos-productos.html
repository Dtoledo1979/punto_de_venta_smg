<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Productos — South Media Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1116; --surface:#FFFFFF; --surface-alt:#F4F6F8; --ink:#12161C;
    --muted:#62707D; --accent:#A8E020; --accent-ink:#1A2333;
    --danger:#E4483A; --warn:#D98B00; --border:#E2E6EA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--surface-alt); color:var(--ink); font-family:'Inter',Arial,sans-serif;}
  header{background:var(--bg); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  header .id{display:flex; align-items:center; gap:9px;}
  header .mark path{fill:var(--accent);}
  header h1{font-family:'Sora',sans-serif; font-size:15px; font-weight:700; margin:0;}
  header .back{color:#C9D3DC; text-decoration:none; font-size:13px;}
  .event-strip{background:#171C24; color:#C9D3DC; font-size:13px; padding:9px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .event-strip a{color:var(--accent); font-size:12.5px; cursor:pointer; text-decoration:underline;}
  main{max-width:1100px; margin:0 auto; padding:18px; display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
  @media (max-width:860px){ main{grid-template-columns:1fr;} }
  .card{background:var(--surface); border-radius:14px; padding:18px; box-shadow:0 1px 2px rgba(15,23,32,.06); border:1px solid var(--border); transition:box-shadow .15s;}
  .card h2{font-family:'Sora',sans-serif; font-size:16px; margin:0 0 12px;}
  .toggle{color:#3E6BD6; font-size:13px; cursor:pointer; background:none; border:none; padding:0; margin-bottom:10px; display:inline-block;}
  .menu-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px;}
  .item-btn{padding:14px 10px; border:1px solid var(--border); border-radius:11px; background:var(--surface-alt); cursor:pointer; text-align:left; font-size:14px; font-weight:500; color:var(--ink); min-height:58px; transition:background .1s, transform .05s;}
  .item-btn:active{background:#E4EEFB; border-color:#B9D2F5; transform:scale(0.98);}
  .item-btn .price{display:block; font-size:12px; color:var(--muted); margin-top:3px; font-weight:400;}
  .item-btn .stock-badge{display:block; font-size:10.5px; color:var(--warn); margin-top:2px; font-weight:600;}
  @media (max-width:420px){
    .menu-grid{grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:6px;}
    .item-btn{padding:10px 8px; font-size:13px; min-height:50px;}
  }
  .cart-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; gap:8px;}
  .cart-row .name{flex:1;}
  .qty{display:flex; align-items:center; gap:7px;}
  .qty button{width:28px; height:28px; border-radius:7px; border:1px solid var(--border); background:#fff; font-size:15px; cursor:pointer;}
  .total-row{display:flex; justify-content:space-between; font-size:19px; font-weight:700; margin-top:12px; padding-top:12px; border-top:2px solid var(--ink); font-family:'Sora',sans-serif;}
  .btn{display:block; width:100%; padding:14px; border:none; border-radius:10px; font-size:15.5px; font-weight:600; cursor:pointer; margin-top:9px; font-family:'Inter',sans-serif;}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-secondary{background:var(--surface-alt); color:var(--ink); border:1px solid var(--border);}
  .btn-danger{background:#FBE6E4; color:#A3271D;}
  .btn-small{width:auto; padding:8px 12px; margin:0; font-size:13px;}
  .pay-buttons{display:flex; gap:8px; margin-top:10px;}
  .pay-buttons button{flex:1;}
  .customer-input{width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-top:10px; font-family:inherit;}
  .cash-panel{margin-top:10px; padding:12px; background:var(--surface-alt); border:1px solid var(--border); border-radius:10px;}
  .cash-panel label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px;}
  .cash-panel input{width:100%; padding:11px; border:1px solid var(--border); border-radius:8px; font-size:17px; font-weight:600;}
  .cash-feedback{font-size:14px; font-weight:600; margin-top:8px; min-height:18px;}
  .cash-feedback.ok{color:#1E7A3D;}
  .cash-feedback.warn{color:#B8720A;}
  #obs{width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-top:10px; resize:vertical; min-height:40px; font-family:inherit;}
  .edit-item{border:1px solid var(--border); border-radius:10px; padding:9px; margin-bottom:8px;}
  .edit-row{display:flex; gap:6px; align-items:center;}
  .edit-row input{padding:8px; border:1px solid var(--border); border-radius:7px; font-size:13px;}
  .edit-row input.name{flex:2;} .edit-row input.price{flex:1; width:70px;}
  .edit-row button{border:none; background:#FBE6E4; color:#A3271D; border-radius:7px; padding:7px 10px; cursor:pointer; flex:none;}
  .stock-row{display:flex; gap:6px; align-items:center; margin-top:7px; padding-top:7px; border-top:1px dashed var(--border); flex-wrap:wrap;}
  .stock-row label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; flex:none;}
  .stock-row input[type=number]{width:90px; padding:6px; border:1px solid var(--border); border-radius:6px; font-size:12.5px;}
  .stock-row button{border:none; background:var(--surface-alt); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer;}
  .stock-actions .reset-btn{background:#FBE9D6; border-color:#EBC894;}
  .stock-actions .add-btn{background:#DCF1E3; border-color:#9BD8B0;}
  .stock-history{margin-top:7px; overflow-x:auto;}
  #stock-panel{display:none;}
  .stock-alert{color:#B8720A; font-weight:700;}
  .search-box{display:flex; gap:8px;}
  .search-box input{flex:1; padding:9px; border:1px solid var(--border); border-radius:8px; font-size:13px;}
  .search-row{display:flex; justify-content:space-between; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); font-size:13.5px; gap:8px;}
  .search-row .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .search-actions{display:flex; gap:6px; flex:none;}
  .search-actions button{padding:7px 10px; font-size:12px; margin:0;}
  #search-panel{display:none; margin-top:10px;}
  .add-form{display:flex; gap:6px; margin-top:8px;}
  .add-form input{flex:1; padding:8px; border:1px solid var(--border); border-radius:7px; font-size:13px;}
  table.tbl{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
  table.tbl th, table.tbl td{text-align:left; padding:6px 4px; border-bottom:1px solid var(--border);}
  table.tbl th{color:var(--muted); font-weight:500;}
  .ticket-note{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .wide-card{max-width:1064px; margin-left:18px; margin-right:18px;}
  @media (min-width:1140px){ .wide-card{margin-left:auto; margin-right:auto;} }
  #summary{display:none;}
  #pin-overlay,#modal-overlay{position:fixed; inset:0; background:rgba(10,13,18,.6); display:flex; align-items:center; justify-content:center; z-index:9999; padding:16px;}
  .modal{background:#fff; border-radius:14px; padding:24px; max-width:340px; width:100%; text-align:center;}
  .modal h3{font-family:'Sora',sans-serif; margin:0 0 6px; font-size:17px;}
  .modal p{font-size:13.5px; color:var(--muted); margin:0 0 16px;}
  .modal input{width:100%; padding:12px; border:1px solid var(--border); border-radius:9px; font-size:20px; text-align:center; letter-spacing:4px;}
  .modal .row{display:flex; gap:8px; margin-top:14px;}
  #toast{display:none; position:fixed; top:14px; left:50%; transform:translateX(-50%); background:#12161C; color:#fff; padding:11px 20px; border-radius:9px; font-size:13.5px; z-index:10000; max-width:90%; text-align:center;}
  #receipt-area{display:none;}
  @page{ size:80mm auto; margin:2mm; }
  @media print{
    body *{visibility:hidden;}
    #receipt-area, #receipt-area *{visibility:visible;}
    #receipt-area{display:block !important; position:absolute; top:0; left:0; width:80mm;}
    .receipt-copy{padding:4px 6px; font-family:monospace; width:100%;}
    .receipt-copy h3{text-align:center; margin:0 0 4px; font-size:13px;}
    .receipt-copy .line{display:flex; justify-content:space-between; font-size:12px;}
    .receipt-copy .obs{font-size:11px; margin:4px 0; word-wrap:break-word;}
    .receipt-copy hr{border:none; border-top:1px dashed #000;}
    .cut{text-align:center; font-size:11px; margin:10px 0; letter-spacing:2px;}
  }
</style>
</head>
<body>

<header>
  <div class="id">
    <svg class="mark" width="20" height="20" viewBox="0 0 24 24"><path d="M12 1l2.9 7.1L22 11l-7.1 2.9L12 21l-2.9-7.1L2 11l7.1-2.9L12 1z"/></svg>
    <h1 id="register-name">POS Productos</h1>
  </div>
  <a class="back" href="index.html">← Inicio</a>
</header>

<div class="event-strip">
  <span id="event-label">Cargando evento…</span>
  <a onclick="toggleEventForm()">Iniciar nuevo evento</a>
</div>
<div id="event-form" class="card wide-card" style="display:none; margin-top:12px; margin-bottom:0;">
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <input type="text" id="event-name" placeholder="Nombre del evento" style="flex:2; min-width:160px; padding:9px; border:1px solid var(--border); border-radius:8px;">
    <input type="date" id="event-date" style="padding:9px; border:1px solid var(--border); border-radius:8px;">
    <button class="btn btn-primary btn-small" onclick="crearEvento()">Iniciar evento</button>
  </div>
</div>

<main>
  <div class="card">
    <h2>Menú</h2>
    <button class="toggle" onclick="toggleEdit()">✏️ Editar menú (agregar / quitar / precios / stock)</button>
    <button class="toggle" style="margin-left:14px;" onclick="toggleStock()">📦 Ver stock</button>
    <div id="edit-panel" style="display:none; margin-bottom:14px;">
      <button class="toggle" style="font-size:12px;" onclick="abrirAdmin()">⚙️ Administración (renombrar / PIN de caja, Entrega y admin)</button>
      <div id="edit-list"></div>
      <div class="add-form">
        <input type="text" id="new-name" placeholder="Nombre (ej. Terremoto)">
        <input type="number" id="new-price" placeholder="$" style="width:70px;">
        <button class="btn btn-secondary btn-small" onclick="addItem()">Agregar</button>
      </div>
    </div>
    <div id="stock-panel" style="display:none;">
      <div id="stock-body"></div>
    </div>
    <div class="menu-grid" id="menu-grid"></div>
  </div>

  <div class="card">
    <h2>Pedido actual</h2>
    <div id="cart-list"><p style="color:#9AA7B2; font-size:13px;">Toca un ítem del menú para agregarlo.</p></div>
    <div class="total-row"><span>Total</span><span id="total">$0</span></div>
    <input type="text" id="customer-name" class="customer-input" placeholder="Nombre del cliente (obligatorio)">
    <textarea id="obs" placeholder="Observación (ej. sin hielo, sin granadina)"></textarea>

    <div class="pay-buttons">
      <button class="btn btn-primary" style="margin:0;" onclick="pagarConTarjeta()">💳 Tarjeta</button>
      <button class="btn btn-secondary" style="margin:0;" onclick="mostrarEfectivo()">💵 Efectivo</button>
      <button class="btn btn-secondary" style="margin:0;" onclick="pagarCortesia()">🎁 Cortesía</button>
    </div>

    <div id="cash-panel" class="cash-panel" style="display:none;">
      <label>¿Cuánto te dio el cliente?</label>
      <input type="number" id="cash-received" min="0" step="1" placeholder="$" oninput="onCashReceivedInput()">
      <div id="cash-feedback" class="cash-feedback"></div>
      <button class="btn btn-primary" id="cash-confirm-btn" style="display:none;"></button>
    </div>

    <button class="btn btn-secondary" onclick="vaciarCarro()">Vaciar pedido</button>
    <button class="btn btn-danger" id="void-btn" style="display:none;" onclick="anularUltimo()">↩️ Anular último ticket (#<span id="void-num"></span>)</button>
    <div class="ticket-note">Próximo N° de ticket: <b id="next-ticket">—</b></div>
  </div>
</main>

<div class="card wide-card" style="margin-bottom:16px;">
  <button class="toggle" onclick="toggleSearch()">🔎 Buscar ticket (por cliente o número)</button>
  <div id="search-panel" style="display:none; margin-top:10px;">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Nombre del cliente o N° de ticket" onkeydown="if(event.key==='Enter') buscarTicket()">
      <button class="btn btn-primary btn-small" onclick="buscarTicket()">Buscar</button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<div class="card wide-card" style="margin-bottom:24px;">
  <button class="toggle" onclick="toggleSummary()">📊 Ver resumen de ventas</button>
  <button class="btn btn-secondary btn-small" style="float:right;" onclick="exportarCSV()">⬇️ Exportar CSV</button>
  <div id="summary" style="display:none;">
    <h2>Resumen del evento activo</h2>
    <div id="summary-body">Cargando…</div>
  </div>
</div>

<div id="pin-overlay">
  <div class="modal">
    <h3 id="pin-title">Ingresa el PIN</h3>
    <p id="pin-sub">Tu nombre y el PIN de esta caja para comenzar a vender.</p>
    <input type="text" id="operator-name-input" placeholder="Tu nombre" style="margin-bottom:8px;" autofocus>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="8">
    <div class="row">
      <button class="btn btn-secondary" onclick="location.href='index.html'">Cancelar</button>
      <button class="btn btn-primary" onclick="checkPin()">Entrar</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="receipt-area"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://umbkpzhgocryhcbbczhr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtYmtwemhnb2NyeWhjYmJjemhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Mzc2MzIsImV4cCI6MjA5ODAxMzYzMn0.h4LlS7gUh229gnmkxw12g58SRRs0jTas-ox-em1lfbg";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: "pos" } });

  // Cambia esto a true una vez tengas la integración EFTPOS con BNZ/Verifone lista.
  const EFTPOS_ENABLED = false;
  async function sendToEftpos(cardAmount) {
    if (!EFTPOS_ENABLED || cardAmount <= 0) return { ok: true, skipped: true };
    // TODO: reemplazar por la llamada real a la API que entregue BNZ/Verifone.
    // cardAmount ya viene calculado como SOLO la parte pagada con tarjeta
    // (si el pago es mixto, el efectivo no pasa por el terminal).
    return { ok: true };
  }

  let register = null;      // fila de pos.registers
  let activeEvent = null;   // fila de pos.events activa
  let menu = [];             // pos.menu_items
  let cart = {};             // { itemId: {name, price, qty} }
  let operatorName = "";
  let lastOrderId = null, lastTicketNum = null;

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.style.display = "none", 2600);
  }

  async function init() {
    const { data: registers, error } = await sb.from("registers").select("id,name,type,next_ticket,active,created_at").eq("type","producto").eq("active", true).order("created_at").limit(1);
    if (error || !registers || registers.length === 0) {
      showToast("No hay una caja de tipo Producto configurada en Supabase.");
      return;
    }
    register = registers[0];
    document.getElementById("register-name").textContent = register.name;
    document.getElementById("next-ticket").textContent = register.next_ticket;

    const savedPin = sessionStorage.getItem("pos_pin_" + register.id);
    const savedName = sessionStorage.getItem("pos_operator_" + register.id);
    if (savedPin && savedName) {
      const { data: ok } = await sb.rpc("verify_register_pin", { p_register_id: register.id, p_pin: savedPin });
      if (ok) {
        operatorName = savedName;
        document.getElementById("pin-overlay").style.display = "none";
        await afterUnlock();
      }
    }
  }

  function myPin(){ return sessionStorage.getItem("pos_pin_" + register.id) || ""; }

  async function checkPin() {
    const name = document.getElementById("operator-name-input").value.trim();
    const val = document.getElementById("pin-input").value;
    if (!name) { showToast("Escribe tu nombre."); return; }
    const { data: ok } = await sb.rpc("verify_register_pin", { p_register_id: register.id, p_pin: val });
    if (ok) {
      operatorName = name;
      sessionStorage.setItem("pos_pin_" + register.id, val);
      sessionStorage.setItem("pos_operator_" + register.id, name);
      document.getElementById("pin-overlay").style.display = "none";
      afterUnlock();
    } else {
      showToast("PIN incorrecto.");
    }
  }

  async function afterUnlock() {
    document.getElementById("register-name").textContent = register.name + " · " + operatorName;
    await loadActiveEvent();
    await loadMenu();
    renderMenu();
    renderCart();
  }

  async function loadActiveEvent() {
    const { data } = await sb.from("events").select("*").eq("active", true).limit(1).maybeSingle();
    activeEvent = data || null;
    document.getElementById("event-label").textContent = activeEvent ? ("Evento activo: " + activeEvent.name) : "Sin evento activo — crea uno para empezar a vender.";
  }

  function toggleEventForm(){
    const f = document.getElementById("event-form");
    f.style.display = f.style.display === "none" ? "block" : "none";
  }

  async function crearEvento(){
    const name = document.getElementById("event-name").value.trim();
    const date = document.getElementById("event-date").value || null;
    if (!name) { showToast("Escribe el nombre del evento."); return; }
    const { data, error } = await sb.rpc("create_event", { p_register_id: register.id, p_pin: myPin(), p_name: name, p_event_date: date });
    if (error) { showToast("No se pudo crear el evento."); return; }
    activeEvent = data;
    document.getElementById("event-label").textContent = "Evento activo: " + data.name;
    toggleEventForm();
    showToast("Evento iniciado.");
  }

  async function loadMenu(){
    const { data } = await sb.from("menu_items").select("*").eq("register_id", register.id).eq("active", true).order("sort_order");
    menu = data || [];
  }

  function renderMenu(){
    const grid = document.getElementById("menu-grid");
    grid.innerHTML = "";
    menu.forEach(item => {
      const b = document.createElement("button");
      b.className = "item-btn";
      let html = item.name + '<span class="price">$' + Number(item.price).toLocaleString("es-CL") + "</span>";
      if (item.track_stock && item.stock_qty !== null) {
        const pct = item.initial_stock > 0 ? (item.stock_qty / item.initial_stock) : 1;
        html += '<span class="stock-badge">' + item.stock_qty + ' en stock' + (pct <= 0.25 ? " ⚠️" : "") + '</span>';
      }
      b.innerHTML = html;
      b.onclick = () => addToCart(item);
      grid.appendChild(b);
    });
    renderEditList();
    renderStockPanel();
  }

  function toggleStock(){
    const p = document.getElementById("stock-panel");
    p.style.display = p.style.display === "none" ? "block" : "none";
  }

  function renderStockPanel(){
    const box = document.getElementById("stock-body");
    const tracked = menu.filter(m => m.track_stock);
    if (!tracked.length) {
      box.innerHTML = "<p style='color:#9AA7B2; font-size:13px; margin-top:8px;'>Ningún producto tiene el stock activado todavía. Actívalo desde \"Editar menú\".</p>";
      return;
    }
    let html = '<table class="tbl"><tr><th>Producto</th><th>Stock actual</th><th>% restante</th><th></th></tr>';
    tracked.forEach(m => {
      const pct = m.initial_stock > 0 ? Math.round((m.stock_qty / m.initial_stock) * 100) : 0;
      html += '<tr><td>' + m.name + '</td><td>' + m.stock_qty + ' / ' + m.initial_stock + '</td><td>' + pct + '%</td><td>' + (pct <= 25 ? '<span class="stock-alert">¡Reponer!</span>' : '') + '</td></tr>';
    });
    html += '</table>';
    box.innerHTML = html;
  }

  function toggleEdit(){
    const p = document.getElementById("edit-panel");
    p.style.display = p.style.display === "none" ? "block" : "none";
  }

  function renderEditList(){
    const list = document.getElementById("edit-list");
    list.innerHTML = "";
    menu.forEach(item => {
      const wrap = document.createElement("div");
      wrap.className = "edit-item";
      const stockInfo = item.track_stock ? (item.stock_qty + " / " + item.initial_stock + " actual") : "sin stock activado";
      wrap.innerHTML =
        '<div class="edit-row">' +
          '<input class="name" value="' + item.name.replace(/"/g,"&quot;") + '">' +
          '<input class="price" type="number" value="' + item.price + '">' +
          '<button class="del-btn">✕</button>' +
        '</div>' +
        '<div class="stock-row">' +
          '<label><input type="checkbox" class="stock-check" ' + (item.track_stock ? "checked" : "") + '> Controlar stock</label>' +
          '<span style="font-size:12px; color:var(--muted);">' + stockInfo + '</span>' +
        '</div>' +
        '<div class="stock-row stock-actions" style="' + (item.track_stock ? "" : "display:none;") + '">' +
          '<input type="number" class="reset-input" placeholder="reiniciar a">' +
          '<button class="reset-btn">Reiniciar</button>' +
          '<input type="number" class="add-input" placeholder="agregar +">' +
          '<button class="add-btn">Agregar</button>' +
          '<a class="toggle" style="font-size:11.5px; margin:0;" onclick="toggleHistorial(this,\'' + item.id + '\')">Ver historial</a>' +
        '</div>' +
        '<div class="stock-history" style="display:none;"></div>';
      const [nameInput, priceInput] = wrap.querySelectorAll(".edit-row input");
      nameInput.onchange = () => updateItem(item.id, { name: nameInput.value });
      priceInput.onchange = () => updateItem(item.id, { price: Number(priceInput.value) });
      wrap.querySelector(".del-btn").onclick = () => removeItem(item.id);

      const stockCheck = wrap.querySelector(".stock-check");
      const actionsRow = wrap.querySelector(".stock-actions");
      stockCheck.onchange = async () => {
        if (!stockCheck.checked) {
          await sb.rpc("disable_stock", { p_register_id: register.id, p_pin: myPin(), p_item_id: item.id });
          showToast("Stock desactivado para " + item.name + ".");
          await loadMenu(); renderMenu();
          return;
        }
        actionsRow.style.display = "flex";
      };

      wrap.querySelector(".reset-btn").onclick = async () => {
        const input = wrap.querySelector(".reset-input");
        if (input.value === "" || isNaN(Number(input.value))) { showToast("Ingresa una cantidad válida para reiniciar."); return; }
        const qty = Number(input.value);
        await sb.rpc("restock_item", { p_register_id: register.id, p_pin: myPin(), p_item_id: item.id, p_mode: "reset", p_qty: qty, p_note: null, p_by: operatorName || null });
        showToast(item.name + ": stock reiniciado a " + qty + ".");
        await loadMenu(); renderMenu();
      };

      wrap.querySelector(".add-btn").onclick = async () => {
        const input = wrap.querySelector(".add-input");
        if (input.value === "" || isNaN(Number(input.value))) { showToast("Ingresa una cantidad válida para agregar."); return; }
        const qty = Number(input.value);
        await sb.rpc("restock_item", { p_register_id: register.id, p_pin: myPin(), p_item_id: item.id, p_mode: "add", p_qty: qty, p_note: null, p_by: operatorName || null });
        showToast(item.name + ": se agregaron " + qty + " unidades.");
        await loadMenu(); renderMenu();
      };

      list.appendChild(wrap);
    });
  }

  async function toggleHistorial(linkEl, itemId){
    const box = linkEl.closest(".edit-item").querySelector(".stock-history");
    if (box.style.display !== "none") { box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = "Cargando…";
    const { data, error } = await sb.from("stock_movements").select("*").eq("menu_item_id", itemId).order("created_at", { ascending:false }).limit(15);
    if (error || !data || data.length === 0) { box.innerHTML = "<p style='font-size:12px; color:var(--muted);'>Sin movimientos registrados.</p>"; return; }
    const labels = { carga_inicial:"Carga inicial", restock:"Reposición", venta:"Venta", ajuste:"Ajuste" };
    box.innerHTML = '<table class="tbl" style="font-size:11.5px;"><tr><th>Fecha</th><th>Tipo</th><th>Cambio</th><th>Quedó</th><th>Quién</th></tr>' +
      data.map(m => {
        const when = new Date(m.created_at).toLocaleString("es-CL", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
        const change = (m.qty_change > 0 ? "+" : "") + m.qty_change;
        return '<tr><td>' + when + '</td><td>' + (labels[m.type]||m.type) + '</td><td>' + change + '</td><td>' + m.qty_after + '</td><td>' + (m.created_by||"—") + '</td></tr>';
      }).join("") + '</table>';
  }

  async function addItem(){
    const name = document.getElementById("new-name").value.trim();
    const price = Number(document.getElementById("new-price").value);
    if (!name || !price) { showToast("Completa nombre y precio."); return; }
    await sb.rpc("add_menu_item", { p_register_id: register.id, p_pin: myPin(), p_name: name, p_price: price, p_sort_order: menu.length });
    document.getElementById("new-name").value = ""; document.getElementById("new-price").value = "";
    await loadMenu(); renderMenu();
  }

  async function updateItem(id, patch){
    await sb.rpc("update_menu_item", { p_register_id: register.id, p_pin: myPin(), p_item_id: id, p_name: patch.name ?? null, p_price: patch.price ?? null });
    await loadMenu(); renderMenu();
  }

  async function removeItem(id){
    await sb.rpc("remove_menu_item", { p_register_id: register.id, p_pin: myPin(), p_item_id: id });
    await loadMenu(); renderMenu();
  }

  async function abrirAdmin(){
    const pin = prompt("PIN de administrador:");
    if (pin === null) return;
    const { data: ok } = await sb.rpc("verify_admin_pin", { p_pin: pin });
    if (!ok) { showToast("PIN de administrador incorrecto."); return; }

    const nuevoNombre = prompt("Nombre de este punto de venta:", register.name);
    const nuevoPin = prompt("Nuevo PIN de esta caja (deja vacío para no cambiarlo):");
    const nuevoDespachoPin = prompt("Nuevo PIN de Entrega (deja vacío para no cambiarlo):");

    const nombreCambio = nuevoNombre && nuevoNombre.trim() && nuevoNombre.trim() !== register.name ? nuevoNombre.trim() : null;
    if (nombreCambio || nuevoPin || nuevoDespachoPin) {
      await sb.rpc("admin_update_register", {
        p_admin_pin: pin, p_register_id: register.id,
        p_name: nombreCambio, p_pin: nuevoPin || null, p_despacho_pin: nuevoDespachoPin || null
      });
      if (nombreCambio) { register.name = nombreCambio; document.getElementById("register-name").textContent = register.name + " · " + operatorName; }
      if (nuevoPin) { sessionStorage.setItem("pos_pin_" + register.id, nuevoPin); }
      showToast("Datos de la caja actualizados.");
    }

    const nuevoAdminPin = prompt("Nuevo PIN de administrador (deja vacío para no cambiarlo):");
    if (nuevoAdminPin) {
      await sb.rpc("admin_update_admin_pin", { p_admin_pin: pin, p_new_pin: nuevoAdminPin });
      showToast("PIN de administrador actualizado.");
    }
  }

  function addToCart(item){
    if (!cart[item.id]) cart[item.id] = { name: item.name, price: Number(item.price), qty: 0 };
    cart[item.id].qty += 1;
    if (item.track_stock && item.stock_qty !== null && cart[item.id].qty > item.stock_qty) {
      showToast("⚠️ Solo quedan " + item.stock_qty + " unidades de " + item.name + " en stock.");
    }
    renderCart();
  }

  function cartTotal(){
    return Object.keys(cart).reduce((s,id) => s + cart[id].price * cart[id].qty, 0);
  }

  function renderCart(){
    const list = document.getElementById("cart-list");
    const keys = Object.keys(cart);
    if (keys.length === 0) {
      list.innerHTML = '<p style="color:#9AA7B2; font-size:13px;">Toca un ítem del menú para agregarlo.</p>';
    } else {
      list.innerHTML = keys.map(id => {
        const l = cart[id];
        return '<div class="cart-row"><span class="name">' + l.name + '</span>' +
          '<div class="qty"><button onclick="changeQty(\'' + id + '\',-1)">−</button><span>' + l.qty + '</span><button onclick="changeQty(\'' + id + '\',1)">+</button></div>' +
          '<span>$' + Math.round(l.price * l.qty).toLocaleString("es-CL") + '</span></div>';
      }).join("");
    }
    document.getElementById("total").textContent = "$" + Math.round(cartTotal()).toLocaleString("es-CL");
  }

  function changeQty(id, delta){
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    renderCart();
  }

  function vaciarCarro(){
    cart = {}; document.getElementById("obs").value = ""; document.getElementById("customer-name").value = "";
    resetCashPanel();
    renderCart();
  }

  function resetCashPanel(){
    document.getElementById("cash-panel").style.display = "none";
    document.getElementById("cash-received").value = "";
    document.getElementById("cash-feedback").textContent = "";
    document.getElementById("cash-feedback").className = "cash-feedback";
    document.getElementById("cash-confirm-btn").style.display = "none";
  }

  function round2(n){ return Math.round(n * 100) / 100; }

  function mostrarEfectivo(){
    const panel = document.getElementById("cash-panel");
    const showing = panel.style.display !== "none";
    if (showing) { resetCashPanel(); return; }
    panel.style.display = "block";
    document.getElementById("cash-received").focus();
  }

  function onCashReceivedInput(){
    const total = cartTotal();
    const received = round2(Number(document.getElementById("cash-received").value) || 0);
    const feedback = document.getElementById("cash-feedback");
    const btn = document.getElementById("cash-confirm-btn");
    if (received <= 0) { feedback.textContent = ""; feedback.className = "cash-feedback"; btn.style.display = "none"; return; }

    if (received >= total) {
      const change = round2(received - total);
      feedback.textContent = change > 0 ? ("Vuelto: $" + Math.round(change).toLocaleString("es-CL")) : "Pago exacto — sin vuelto.";
      feedback.className = "cash-feedback ok";
      btn.textContent = "Cobrar";
      btn.style.display = "block";
      btn.onclick = () => finalizarCobro(total, 0, "efectivo", received);
    } else {
      const remaining = round2(total - received);
      feedback.textContent = "Faltan $" + Math.round(remaining).toLocaleString("es-CL");
      feedback.className = "cash-feedback warn";
      btn.textContent = "Cobrar $" + Math.round(received).toLocaleString("es-CL") + " efectivo + $" + Math.round(remaining).toLocaleString("es-CL") + " tarjeta";
      btn.style.display = "block";
      btn.onclick = () => finalizarCobro(received, remaining, "mixto", received);
    }
  }

  function pagarConTarjeta(){
    const total = cartTotal();
    if (total <= 0) return;
    finalizarCobro(0, total, "tarjeta", 0);
  }

  async function pagarCortesia(){
    const total = cartTotal();
    if (total <= 0) return;
    const pin = prompt("PIN de administrador para autorizar la cortesía:");
    if (pin === null) return;
    const { data: ok } = await sb.rpc("verify_admin_pin", { p_pin: pin });
    if (!ok) { showToast("PIN de administrador incorrecto."); return; }
    finalizarCobro(0, 0, "cortesia", 0, pin);
  }

  let cobrando = false;

  async function finalizarCobro(cash, card, paymentMethod, receivedCash, adminPin){
    if (cobrando) return;
    const keys = Object.keys(cart);
    if (keys.length === 0) return;
    if (!activeEvent) { showToast("Primero inicia un evento."); return; }

    const customerName = document.getElementById("customer-name").value.trim();
    if (!customerName) {
      showToast("Escribe el nombre del cliente antes de cobrar.");
      document.getElementById("customer-name").focus();
      return;
    }

    cobrando = true;
    try {
      const total = cartTotal();
      const eftposResult = await sendToEftpos(card);
      if (!eftposResult.ok) { showToast("El terminal de pago no confirmó el cobro."); return; }

      const obs = document.getElementById("obs").value.trim();
      const items = keys.map(id => ({ id, name: cart[id].name, qty: cart[id].qty, price: cart[id].price, subtotal: cart[id].price * cart[id].qty, delivered: false }));

      const { data: order, error } = await sb.rpc("create_order", {
        p_register_id: register.id, p_pin: myPin(), p_event_id: activeEvent.id, p_items: items,
        p_payment_method: paymentMethod, p_cash: cash, p_card: card,
        p_customer_name: customerName || null, p_obs: obs, p_attended_by: operatorName || null,
        p_admin_pin: adminPin || null
      });

      if (error || !order) { showToast("No se pudo registrar el pedido: " + (error ? error.message : "")); return; }

      const ticketNum = order.ticket_num;
      lastOrderId = order.id; lastTicketNum = ticketNum;
      document.getElementById("void-btn").style.display = "block";
      document.getElementById("void-num").textContent = ticketNum;
      document.getElementById("next-ticket").textContent = ticketNum + 1;

      printReceipt(ticketNum, items, total, obs, new Date(order.paid_at), cash, card, paymentMethod, customerName, receivedCash);
      showToast("Pedido #" + ticketNum + " enviado a Entrega.");

      const trackedSold = keys.filter(id => {
        const m = menu.find(x => x.id === id);
        return m && m.track_stock && m.stock_qty !== null;
      });
      if (trackedSold.length) {
        await loadMenu(); renderMenu();
        const low = [];
        trackedSold.forEach(id => {
          const m = menu.find(x => x.id === id);
          if (m && m.initial_stock > 0 && (m.stock_qty / m.initial_stock) <= 0.25) low.push(m.name + " (" + m.stock_qty + ")");
        });
        if (low.length) setTimeout(() => showToast("⚠️ Reponer stock: " + low.join(", ")), 1800);
      }

      if (document.getElementById("summary").style.display !== "none") renderSummary();

      vaciarCarro();
    } finally {
      cobrando = false;
    }
  }

  function printReceipt(ticketNum, items, total, obs, now, cash, card, paymentMethod, customerName, receivedCash){
    const timeStr = now.toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit" });
    const isCortesia = paymentMethod === "cortesia";
    function buildCopy(label){
      let html = '<div class="receipt-copy"><h3>South Media — ' + label + '</h3>';
      html += '<div class="line"><b>Ticket #' + ticketNum + '</b><span>' + timeStr + '</span></div>';
      if (customerName) html += '<div class="line"><span>Cliente</span><span>' + customerName + '</span></div>';
      html += '<hr>';
      items.forEach(l => {
        if (isCortesia) {
          html += '<div class="line"><span>' + l.qty + 'x ' + l.name + '</span><span><s>$' + Math.round(l.subtotal) + '</s> $0</span></div>';
        } else {
          html += '<div class="line"><span>' + l.qty + 'x ' + l.name + '</span><span>$' + Math.round(l.subtotal) + '</span></div>';
        }
      });
      if (obs) html += '<hr><div class="obs"><b>OBS:</b> ' + obs + '</div>';
      html += '<hr>';
      if (isCortesia) {
        html += '<div class="line"><b>🎁 CORTESÍA — 100% DCTO.</b></div>';
        html += '<div class="line"><span>Valor referencial</span><span>$' + Math.round(total) + '</span></div>';
        html += '<div class="line"><b>TOTAL A PAGAR</b><b>$0</b></div>';
      } else {
        html += '<div class="line"><b>TOTAL</b><b>$' + Math.round(total) + '</b></div>';
        if (paymentMethod === "mixto") {
          html += '<div class="line"><span>Efectivo</span><span>$' + Math.round(cash) + '</span></div>';
          html += '<div class="line"><span>Tarjeta</span><span>$' + Math.round(card) + '</span></div>';
        } else if (paymentMethod === "efectivo" && receivedCash > total) {
          html += '<div class="line"><span>Recibido</span><span>$' + Math.round(receivedCash) + '</span></div>';
          html += '<div class="line"><span>Vuelto</span><span>$' + Math.round(receivedCash - total) + '</span></div>';
        }
      }
      html += '</div>';
      return html;
    }
    document.getElementById("receipt-area").innerHTML = buildCopy("COPIA BARRA") + '<div class="cut">- - - CORTAR AQUÍ - - -</div>' + buildCopy("COPIA CLIENTE");
    window.print();
  }

  async function anularUltimo(){
    if (!lastOrderId) return;
    await sb.rpc("void_order", { p_register_id: register.id, p_pin: myPin(), p_order_id: lastOrderId });
    document.getElementById("void-btn").style.display = "none";
    showToast("Ticket #" + lastTicketNum + " anulado.");
    lastOrderId = null;
  }

  function toggleSearch(){
    const p = document.getElementById("search-panel");
    p.style.display = p.style.display === "none" ? "block" : "none";
    if (p.style.display === "block") document.getElementById("search-input").focus();
  }

  async function buscarTicket(){
    const q = document.getElementById("search-input").value.trim();
    const results = document.getElementById("search-results");
    if (!q) { results.innerHTML = ""; return; }
    let query = sb.from("orders").select("*").eq("register_id", register.id).order("paid_at", { ascending:false }).limit(20);
    query = /^\d+$/.test(q) ? query.eq("ticket_num", Number(q)) : query.ilike("customer_name", "%" + q + "%");
    const { data, error } = await query;
    if (error || !data || data.length === 0) { results.innerHTML = "<p style='color:#9AA7B2; font-size:13px;'>Sin resultados.</p>"; return; }
    results.innerHTML = data.map(renderSearchRow).join("");
  }

  function renderSearchRow(o){
    const statusLabel = { pendiente_entrega:"Por entregar", entregado:"Entregado", anulado:"Anulado" }[o.status] || o.status;
    const itemsTxt = o.items.map(it => it.qty + "x " + it.name).join(", ");
    const timeTxt = new Date(o.paid_at).toLocaleString("es-CL", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
    return '<div class="search-row">' +
      '<div><b>#' + o.ticket_num + '</b> — ' + (o.customer_name || "(sin nombre)") +
        '<div class="meta">' + timeTxt + ' · ' + statusLabel + ' · $' + Math.round(o.total).toLocaleString("es-CL") + ' · ' + itemsTxt + '</div></div>' +
      '<div class="search-actions">' +
        (o.status !== "pendiente_entrega" ? '<button class="btn btn-secondary" onclick="reabrirPedido(\'' + o.id + '\')">Reabrir</button>' : '') +
        (o.status !== "anulado" ? '<button class="btn btn-danger" onclick="anularPedidoBuscado(\'' + o.id + '\')">Anular</button>' : '') +
      '</div></div>';
  }

  async function reabrirPedido(id){
    await sb.rpc("reopen_order", { p_register_id: register.id, p_pin: myPin(), p_order_id: id });
    showToast("Pedido reabierto — vuelve a aparecer en Entrega.");
    buscarTicket();
  }

  async function anularPedidoBuscado(id){
    await sb.rpc("void_order", { p_register_id: register.id, p_pin: myPin(), p_order_id: id });
    showToast("Pedido anulado.");
    buscarTicket();
  }

  function toggleSummary(){
    const s = document.getElementById("summary");
    const willShow = s.style.display === "none";
    s.style.display = willShow ? "block" : "none";
    if (willShow) renderSummary();
  }

  async function renderSummary(){
    if (!activeEvent) { document.getElementById("summary-body").innerHTML = "<p>No hay evento activo.</p>"; return; }
    const { data: orders } = await sb.from("orders").select("*").eq("event_id", activeEvent.id).eq("register_id", register.id).neq("status","anulado");
    const body = document.getElementById("summary-body");
    if (!orders || orders.length === 0) { body.innerHTML = "<p style='color:#9AA7B2; font-size:13px;'>Aún no hay ventas en este evento.</p>"; return; }

    const paid = orders.filter(o => o.payment_method !== "cortesia");
    const courtesy = orders.filter(o => o.payment_method === "cortesia");
    let total = 0, cash = 0, card = 0;
    const byProduct = {};
    paid.forEach(o => {
      total += Number(o.total);
      cash += Number(o.cash_amount || 0);
      card += Number(o.card_amount || 0);
      o.items.forEach(it => {
        if (!byProduct[it.name]) byProduct[it.name] = { qty:0, total:0 };
        byProduct[it.name].qty += it.qty; byProduct[it.name].total += it.subtotal;
      });
    });

    let html = '<p style="font-size:19px; font-weight:700; font-family:Sora,sans-serif;">Total vendido: $' + Math.round(total).toLocaleString("es-CL") + '</p>';
    html += '<p style="font-size:13px; color:var(--muted);">Efectivo: $' + Math.round(cash).toLocaleString("es-CL") + ' &nbsp;|&nbsp; Tarjeta: $' + Math.round(card).toLocaleString("es-CL") + '</p>';
    html += '<table class="tbl"><tr><th>Producto</th><th>Cant.</th><th>Total</th></tr>';
    Object.keys(byProduct).sort((a,b) => byProduct[b].total - byProduct[a].total).forEach(name => {
      html += '<tr><td>' + name + '</td><td>' + byProduct[name].qty + '</td><td>$' + Math.round(byProduct[name].total).toLocaleString("es-CL") + '</td></tr>';
    });
    html += '</table>';
    if (courtesy.length){
      html += '<p style="font-weight:600; margin-top:14px;">🎁 Cortesías entregadas (' + courtesy.length + ')</p>';
      html += '<table class="tbl"><tr><th>Cliente</th><th>Ticket</th><th>Hora</th><th>Productos</th></tr>';
      courtesy.forEach(o => {
        const itemsTxt = o.items.map(it => it.qty + "x " + it.name).join(", ");
        const horaTxt = new Date(o.paid_at).toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit" });
        html += '<tr><td>' + (o.customer_name || "(sin nombre)") + '</td><td>#' + o.ticket_num + '</td><td>' + horaTxt + '</td><td>' + itemsTxt + '</td></tr>';
      });
      html += '</table>';
    }
    body.innerHTML = html;
  }

  function csvField(val){
    const s = String(val ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }

  async function exportarCSV(){
    const { data: orders } = await sb.from("orders").select("*, events(name)").eq("register_id", register.id);
    const rows = [["Evento","Fecha","Ticket","Hora","Cliente","Producto","Cantidad","PrecioUnitario","Subtotal","TotalTicket","MetodoPago","Efectivo","Tarjeta","Estado","Observacion"]];
    (orders||[]).forEach(o => {
      const evName = o.events ? o.events.name : "";
      const paidDate = new Date(o.paid_at);
      const fecha = paidDate.toLocaleDateString("es-CL");
      const hora = paidDate.toLocaleTimeString("es-CL", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
      o.items.forEach(it => {
        rows.push([evName, fecha, o.ticket_num, hora, o.customer_name||"", it.name, it.qty, it.price, it.subtotal, o.total, o.payment_method, o.cash_amount, o.card_amount, o.status, o.obs||""]);
      });
    });
    const csv = rows.map(r => r.map(csvField).join(",")).join("\n");
    const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "ventas_productos.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  init();
</script>
