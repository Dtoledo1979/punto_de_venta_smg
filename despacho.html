<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Delivery</title>
<script>window.POS_ENV = { supabaseUrl: "%VITE_SUPABASE_URL%", supabaseAnonKey: "%VITE_SUPABASE_ANON_KEY%", officePage: "delivery" }; document.documentElement.classList.add("pos-auth-pending");</script>
<style>html.pos-auth-pending body{visibility:hidden}</style>
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/register.css">
<style>
  body{overflow:auto;}
  .kds-top{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; flex-wrap:wrap;}
  .kds-top .who{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
  .kds-top .who .mark{width:32px; height:32px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:700 15px var(--f-display); flex:none;}
  .kds-top b{font:700 16px var(--f-display);}
  .kds-top .muted{font-size:13px;}
  .kds-wrap{padding:14px; display:grid; gap:14px;}
  .board{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; align-items:start;}
  .kcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); display:grid; overflow:hidden;}
  .kcard .kh{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; background:var(--sunken);}
  .kcard .kh .num{font:700 22px var(--f-display);}
  .kcard .kh .timer{font:700 16px var(--f-display); font-variant-numeric:tabular-nums; padding:2px 10px; border-radius:20px; background:var(--surface);}
  .kcard.warn .kh{background:var(--warn-soft);} .kcard.warn .timer{color:var(--warn);}
  .kcard.bad .kh{background:var(--bad-soft);} .kcard.bad .timer{color:var(--bad);}
  .kcard .kmeta{padding:6px 12px 0; font-size:13px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap;}
  .kline{display:grid; grid-template-columns:28px minmax(0,1fr); gap:8px; padding:10px 12px; border-top:1px solid var(--line); cursor:pointer; text-align:left; background:transparent; border-left:0; border-right:0; border-bottom:0; color:var(--ink); font:inherit;}
  .kline:first-of-type{border-top:0;}
  .kline .ck{width:24px; height:24px; border-radius:7px; border:2px solid var(--line-strong); display:grid; place-items:center; font-size:14px; color:var(--accent-ink);}
  .kline.done{color:var(--faint);} .kline.done .ck{background:var(--accent); border-color:var(--accent);}
  .kline .q{font:700 17px var(--f-body);}
  .kline .mods{font-size:14.5px; color:var(--ink); font-weight:600;} .kline.done .mods{color:var(--faint);}
  .kline .note{font-size:14px; color:var(--warn); font-weight:600;}
  .kline .st{font-size:12px; color:var(--muted);}
  .kcard .kfoot{padding:10px 12px; border-top:1px solid var(--line);}
  .kcard .kfoot .btn{width:100%; min-height:48px;}
  .recent{display:flex; gap:8px; flex-wrap:wrap; font-size:13.5px;}
</style>
</head>
<body>
<header class="kds-top">
  <div class="who"><span class="mark" id="mark">·</span><div><b data-i18n>Delivery</b> <span class="muted" id="place"></span></div></div>
  <div class="seg" id="stations" role="group" aria-label="Station"></div>
  <button class="top-btn" type="button" id="find-btn" data-i18n>Find a sale</button>
  <button class="top-btn" type="button" id="menu-btn" aria-label="Menu">⋯</button>
</header>
<div id="office-banner"></div>
<main class="kds-wrap">
  <div class="board" id="board"></div>
  <div class="empty" id="empty" hidden><b data-i18n>Nothing to prepare</b><span data-i18n>New orders appear here as soon as they're paid.</span></div>
  <section class="panel"><div class="panel-head"><h2 data-i18n>Recently delivered</h2></div><div class="recent" id="recent"></div></section>
</main>

<div class="lock" id="lock" hidden><div class="lock-card" id="lock-card"></div></div>
<dialog class="dialog wide" id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="/vendor/supabase.js"></script>
<script src="/js/pos-utils.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/i18n-es.js"></script>
<script src="/js/pos-core.js"></script>
<script>
  const sb = posCore.sb;
  const E = posUtils.escapeHtml;
  const $ = (id) => document.getElementById(id);
  const WARN_AFTER = 300, BAD_AFTER = 600;   // segundos: amarillo a los 5 min, rojo a los 10
  const STATIONS = ["all", "coffee", "kitchen", "bar", "collection"];
  let reg = null, operator = "", pending = [], recent = [];
  let station = (() => { try { return localStorage.getItem("pos_kds_station") || "all"; } catch (_) { return "all"; } })();
  const stationOf = (it) => it.station || "bar";
  const pin = () => sessionStorage.getItem("pos_despacho_pin_" + reg.id) || "";
  const stationLabel = (s) => s === "all" ? t("All stations") : posCore.label("station", s);

  function toast(text) { const el = $("toast"); el.textContent = text; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2400); }
  const fail = (p, e) => toast(t(p) + ": " + posCore.errorText(e));

  async function resolveRegister() {
    const { data: regs } = await sb.from("registers").select("id, name, location_id, locations(name)").eq("org_id", posCore.orgId).eq("type", "product").eq("active", true).order("created_at");
    if (!regs || !regs.length) { $("lock").hidden = false; $("lock-card").innerHTML = "<h1>" + E(t("Delivery")) + '</h1><p class="muted">' + E(t("This business doesn't have a register yet.")) + '</p><a class="btn" href="/index.html">' + E(t("Back to the office")) + "</a>"; return null; }
    let saved = null; try { saved = localStorage.getItem("pos_register_product"); } catch (_) { /* sin storage */ }
    const s = regs.find((r) => r.id === saved);
    if (regs.length === 1 || s) return s || regs[0];
    return new Promise((resolve) => {
      $("lock").hidden = false;
      $("lock-card").innerHTML = "<h1>" + E(t("Which register's orders?")) + '</h1><div class="list">' + regs.map((r) => '<button class="btn btn-lg btn-block" type="button" data-id="' + E(r.id) + '" style="margin-bottom:8px;">' + E((r.locations ? r.locations.name + " · " : "") + r.name) + "</button>").join("") + "</div>";
      $("lock-card").querySelectorAll("[data-id]").forEach((b) => b.onclick = () => { try { localStorage.setItem("pos_register_product", b.dataset.id); } catch (_) { /* sin storage */ } resolve(regs.find((r) => r.id === b.dataset.id)); });
    });
  }

  function showLock() {
    $("lock").hidden = false;
    let code = "";
    $("lock-card").innerHTML = '<div class="stack-sm"><span class="muted">' + E(posCore.org.name) + "</span><h1>" + E(t("Delivery")) + '</h1><span class="muted">' + E((reg.locations ? reg.locations.name + " · " : "") + reg.name) + "</span></div>" +
      '<input class="input" id="lock-name" placeholder="' + E(t("Your name")) + '" autocomplete="off" value="' + E(sessionStorage.getItem("pos_despacho_operator_" + reg.id) || "") + '">' +
      '<p class="muted">' + E(t("Enter the Delivery PIN.")) + '</p><div class="pin-dots" id="pin-dots"></div><div class="keypad">' +
      ["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((d) => '<button type="button" data-k="' + d + '">' + d + "</button>").join("") +
      '<button type="button" class="wide" data-k="del">⌫</button><button type="button" data-k="0">0</button><button type="button" class="wide" data-k="ok">' + E(t("Enter")) + "</button></div>" +
      '<div class="msg error" id="lock-msg" hidden></div><a class="btn btn-ghost btn-sm" href="/index.html">' + E(t("Back to the office")) + "</a>";
    const dots = () => { $("pin-dots").innerHTML = Array.from({ length: Math.max(4, code.length) }, (_, i) => '<i class="' + (i < code.length ? "on" : "") + '"></i>').join(""); };
    dots();
    const submit = async () => {
      const name = $("lock-name").value.trim(), m = $("lock-msg");
      if (!name) { m.textContent = t("Type your name."); m.hidden = false; return; }
      const { data: ok, error } = await sb.rpc("verify_despacho_pin", { p_register_id: reg.id, p_pin: code });
      if (error || !ok) { m.textContent = error ? posCore.errorText(error) : posCore.errorText({ message: "pin.incorrect" }); m.hidden = false; code = ""; dots(); return; }
      sessionStorage.setItem("pos_despacho_pin_" + reg.id, code); sessionStorage.setItem("pos_despacho_operator_" + reg.id, name);
      operator = name; $("lock").hidden = true; start();
    };
    $("lock-card").querySelectorAll("[data-k]").forEach((b) => b.onclick = () => {
      const k = b.dataset.k;
      if (k === "del") code = code.slice(0, -1); else if (k === "ok") return submit(); else if (code.length < 8) code += k;
      $("lock-msg").hidden = true; dots();
    });
    document.onkeydown = (e) => {
      if ($("lock").hidden) return;
      if (document.activeElement === $("lock-name")) { if (e.key === "Enter") submit(); return; }
      if (/^[0-9]$/.test(e.key) && code.length < 8) { code += e.key; dots(); } else if (e.key === "Backspace") { code = code.slice(0, -1); dots(); } else if (e.key === "Enter") submit();
    };
  }

  async function init() {
    reg = await resolveRegister();
    if (!reg) return;
    $("mark").textContent = (posCore.org.name || "·").charAt(0).toUpperCase();
    $("place").textContent = (reg.locations ? reg.locations.name + " · " : "") + reg.name;
    const savedPin = pin(), savedName = sessionStorage.getItem("pos_despacho_operator_" + reg.id);
    if (savedPin && savedName) {
      const { data: ok } = await sb.rpc("verify_despacho_pin", { p_register_id: reg.id, p_pin: savedPin });
      if (ok) { operator = savedName; return start(); }
    }
    showLock();
  }

  let started = false;
  async function start() {
    $("place").textContent = (reg.locations ? reg.locations.name + " · " : "") + reg.name + " · " + operator;
    if (started) return;
    started = true;
    renderStations();
    await refresh();
    sb.channel("kds-" + reg.id).on("postgres_changes", { event: "*", schema: "pos", table: "orders", filter: "register_id=eq." + reg.id }, () => refresh())
      .subscribe((s) => { if (s === "SUBSCRIBED") refresh(); });
    setInterval(refresh, 30000);
    setInterval(render, 1000);
    window.addEventListener("online", refresh);
  }

  async function refresh() {
    const [{ data: p }, { data: r }] = await Promise.all([
      sb.from("orders").select("*, events(name)").eq("register_id", reg.id).eq("status", "pending_delivery").order("paid_at"),
      sb.from("orders").select("id, ticket_num, customer_name, paid_at, delivered_at").eq("register_id", reg.id).eq("status", "delivered").order("delivered_at", { ascending: false }).limit(8),
    ]);
    pending = p || []; recent = r || [];
    render();
  }

  function renderStations() {
    $("stations").innerHTML = STATIONS.map((s) => '<button type="button" data-s="' + s + '" aria-pressed="' + String(s === station) + '">' + E(stationLabel(s)) + "</button>").join("");
    $("stations").querySelectorAll("button").forEach((b) => b.onclick = () => { station = b.dataset.s; try { localStorage.setItem("pos_kds_station", station); } catch (_) { /* sin storage */ } renderStations(); render(); });
  }

  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  const typeLabel = (o) => o.order_type === "takeaway" ? t("Takeaway") : o.order_type === "here" ? t("Eat in") : o.order_type === "delivery" ? t("Delivery") : "";

  function render() {
    const visible = station === "all" ? pending : pending.filter((o) => o.items.some((it) => stationOf(it) === station && !it.delivered));
    $("empty").hidden = visible.length > 0;
    const multiEvent = new Set(visible.map((o) => o.event_id)).size > 1;
    $("board").innerHTML = visible.map((o) => {
      const secs = Math.max(0, Math.floor((Date.now() - new Date(o.paid_at).getTime()) / 1000));
      const cls = secs >= BAD_AFTER ? "bad" : secs >= WARN_AFTER ? "warn" : "";
      const lines = o.items.map((it, i) => {
        if (station !== "all" && stationOf(it) !== station) return "";
        return '<button type="button" class="kline' + (it.delivered ? " done" : "") + '" data-o="' + E(o.id) + '" data-i="' + i + '"><span class="ck">' + (it.delivered ? "✓" : "") + "</span><span>" +
          '<span class="q">' + it.qty + "× " + E(it.name) + "</span>" +
          (it.modifiers && it.modifiers.length ? '<div class="mods">' + E(it.modifiers.map((m) => m.name).join(" · ")) + "</div>" : "") +
          (it.note ? '<div class="note">“' + E(it.note) + "”</div>" : "") +
          (station === "all" && stationOf(it) !== "none" ? '<div class="st">' + E(posCore.label("station", stationOf(it))) + "</div>" : "") + "</span></button>";
      }).join("");
      const all = o.items.every((it) => it.delivered);
      return '<div class="kcard ' + cls + '"><div class="kh"><span class="num">' + (o.is_test ? "🧪 " : "") + "#" + o.ticket_num + '</span><span class="timer">' + fmt(secs) + "</span></div>" +
        '<div class="kmeta">' + [o.customer_name ? "<b>" + E(o.customer_name) + "</b>" : "", typeLabel(o) ? '<span class="pill">' + E(typeLabel(o)) + "</span>" : "", o.table_label ? '<span class="pill">' + E(t("Table {n}", { n: o.table_label })) + "</span>" : "",
          multiEvent && o.events ? E(o.events.name) : "", E(posCore.fmtTime(o.paid_at))].filter(Boolean).join(" ") + "</div>" + lines +
        (o.obs ? '<div class="kmeta note">' + E(o.obs) + "</div>" : "") +
        '<div class="kfoot">' + (station === "all"
          ? '<button class="btn ' + (all ? "btn-primary" : "") + '" type="button" data-close="' + E(o.id) + '">' + E(all ? t("Close order") : t("Mark all as delivered")) + "</button>"
          : '<button class="btn btn-primary" type="button" data-station="' + E(o.id) + '">' + E(t("{station} ready", { station: posCore.label("station", station) })) + "</button>") + "</div></div>";
    }).join("");
    $("board").querySelectorAll(".kline").forEach((b) => b.onclick = () => toggleItem(b.dataset.o, Number(b.dataset.i)));
    $("board").querySelectorAll("[data-close]").forEach((b) => b.onclick = () => closeOrder(b.dataset.close, b));
    $("board").querySelectorAll("[data-station]").forEach((b) => b.onclick = () => markStation(b.dataset.station, b));
    $("recent").innerHTML = recent.length ? recent.map((o) => '<span class="pill">#' + o.ticket_num + (o.customer_name ? " · " + E(o.customer_name) : "") + " · " +
      E(t("in {time}", { time: fmt(Math.max(0, Math.round((new Date(o.delivered_at) - new Date(o.paid_at)) / 1000))) })) + "</span>").join("") : '<span class="muted">' + E(t("No deliveries recorded yet.")) + "</span>";
  }

  async function toggleItem(id, idx) {
    const { error } = await sb.rpc("despacho_toggle_item", { p_register_id: reg.id, p_despacho_pin: pin(), p_order_id: id, p_item_index: idx });
    if (error) fail("Could not mark it", error);
    refresh();
  }
  async function closeOrder(id, btn) {
    btn.disabled = true;
    const { error } = await sb.rpc("despacho_confirm_all", { p_register_id: reg.id, p_despacho_pin: pin(), p_order_id: id, p_delivered_by: operator || null });
    if (error) { btn.disabled = false; return fail("Could not close the order", error); }
    toast(t("Order delivered.")); refresh();
  }
  async function markStation(id, btn) {
    btn.disabled = true;
    const { error } = await sb.rpc("despacho_mark_station", { p_register_id: reg.id, p_despacho_pin: pin(), p_order_id: id, p_station: station, p_by: operator || null });
    if (error) { btn.disabled = false; return fail("Could not mark it", error); }
    toast(t("{station}: ready.", { station: posCore.label("station", station) })); refresh();
  }

  function dlg(title, body) {
    const d = $("dlg");
    d.innerHTML = '<div class="dialog-body"><div class="dialog-head"><h2>' + E(title) + '</h2><button class="x-btn" type="button" data-x aria-label="Close">×</button></div>' + body + "</div>";
    d.querySelector("[data-x]").onclick = () => d.close();
    d.showModal();
    return d;
  }

  function openFind() {
    const d = dlg(t("Find a sale"), '<div class="row"><input class="input grow" id="q" placeholder="' + E(t("Order number or customer name")) + '"><button class="btn btn-primary" type="button" id="go">' + E(t("Search")) + '</button></div><div class="orders-list" id="res"></div>');
    const go = async () => {
      const q = d.querySelector("#q").value.trim();
      let query = sb.from("orders").select("*, events(name)").eq("register_id", reg.id).order("paid_at", { ascending: false }).limit(20);
      if (q) query = /^\d+$/.test(q) ? query.eq("ticket_num", Number(q)) : query.ilike("customer_name", "%" + q + "%");
      const { data } = await query;
      const res = d.querySelector("#res");
      res.innerHTML = (data || []).length ? data.map((o) => '<div class="ocard"><div class="h"><span>#' + o.ticket_num + " · " + E(o.customer_name || t("(no name)")) + "</span><span>" + E(posCore.label("status", o.status)) + "</span></div>" +
        '<div class="it">' + E(o.items.map((it) => (it.delivered ? "✓ " : "") + it.qty + "× " + it.name).join(", ")) + '</div><div class="muted" style="font-size:13px;">' + E(posCore.fmtDayTime(o.paid_at)) + "</div>" +
        '<div class="acts">' + (o.status !== "pending_delivery" ? '<button class="btn btn-sm" type="button" data-reopen="' + E(o.id) + '">' + E(t("Reopen")) + "</button>" : "") +
        (o.status !== "voided" && !(Number(o.refunded_total) > 0) ? '<button class="btn btn-sm btn-danger" type="button" data-void="' + E(o.id) + '">' + E(t("Void")) + "</button>" : "") + "</div></div>").join("")
        : '<p class="muted">' + E(t("No results.")) + "</p>";
      res.querySelectorAll("[data-reopen]").forEach((b) => b.onclick = async () => {
        const { error } = await sb.rpc("reopen_order", { p_register_id: reg.id, p_pin: pin(), p_order_id: b.dataset.reopen });
        if (error) return fail("Could not reopen", error);
        toast(t("Order reopened.")); go(); refresh();
      });
      res.querySelectorAll("[data-void]").forEach((b) => b.onclick = async () => {
        if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = t("Tap again to confirm"); return; }
        const { error } = await sb.rpc("void_order", { p_register_id: reg.id, p_pin: pin(), p_order_id: b.dataset.void });
        if (error) return fail("Could not void", error);
        toast(t("Order voided.")); go(); refresh();
      });
    };
    d.querySelector("#go").onclick = go;
    d.querySelector("#q").onkeydown = (e) => { if (e.key === "Enter") go(); };
    d.querySelector("#q").focus();
    go();
  }

  function openMenu() {
    const d = dlg(t("Delivery"), '<div class="list"><div class="list-item"><div class="grow"><b>' + E(reg.name) + '</b><div class="muted">' + E(operator) + "</div></div>" +
      '<button class="btn btn-sm" type="button" id="m-lock">' + E(t("Switch person")) + '</button></div></div><div class="row"><button class="btn" type="button" id="m-change">' + E(t("Change register")) + '</button><a class="btn" href="/index.html">' + E(t("Back to the office")) + "</a></div>");
    d.querySelector("#m-lock").onclick = () => { sessionStorage.removeItem("pos_despacho_pin_" + reg.id); d.close(); showLock(); };
    d.querySelector("#m-change").onclick = () => { try { localStorage.removeItem("pos_register_product"); } catch (_) { /* sin storage */ } location.reload(); };
  }

  $("find-btn").onclick = openFind;
  $("menu-btn").onclick = openMenu;
  posCore.ready.then(init);
</script>
</body>
</html>
